<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15803d">
<title>Offline · HikeLog</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1c1c15; --muted:#6b6b5e; --primary:#15803d; }
  @media (prefers-color-scheme: dark) { :root { --bg:#171711; --fg:#f4f4ee; --muted:#a3a396; --primary:#4ade80; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:1.5rem; background:var(--bg); color:var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align:center; }
  main { max-width:22rem; }
  img { width:72px; height:72px; border-radius:16px; }
  h1 { font-size:1.35rem; margin:1rem 0 .5rem; }
  p { color:var(--muted); line-height:1.5; margin:0 0 1.25rem; }
  button { font:inherit; font-weight:600; border:0; border-radius:.6rem; padding:.7rem 1.25rem; background:var(--primary); color:#fff; cursor:pointer; }
  @media (prefers-color-scheme: dark) { button { color:#052e16; } }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" width="72" height="72">
  <h1>You're offline</h1>
  <p>HikeLog needs a connection to load your hikes and lists. Reconnect and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
